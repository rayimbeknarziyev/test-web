<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142b4d">
<title>Ro‘yxatdan o‘tish — TestFlow Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body data-page="register">
<div class="auth-layout">
<aside class="auth-aside" id="auth-aside"></aside>
<main class="auth-main"><div class="auth-card" id="page">
<h1>Hisob yarating</h1>
<p class="sub">Bir daqiqada ro‘yxatdan o‘ting va birinchi testingizni yuklang.</p>
<form id="registerForm" novalidate>
<div class="field"><label class="label" for="name">To‘liq ism</label>
<div class="input-group"><i data-lucide="user"></i><input class="input" id="name" name="name" type="text" placeholder="Ism Familiya" autocomplete="name" required></div></div>
<div class="field"><label class="label" for="email">Email</label>
<div class="input-group"><i data-lucide="mail"></i><input class="input" id="email" name="email" type="email" placeholder="siz@example.com" autocomplete="email" required></div></div>
<div class="field"><label class="label" for="password">Parol</label>
<div class="input-group has-toggle"><i data-lucide="lock"></i><input class="input" id="password" name="password" type="password" placeholder="Kamida 8 ta belgi, harf va raqam" autocomplete="new-password" required></div></div>
<div class="strength" id="strength" data-level="0"><i></i><i></i><i></i><i></i></div>
<div style="height:14px"></div>
<div class="field"><label class="label" for="confirm_password">Parolni tasdiqlang</label>
<div class="input-group has-toggle"><i data-lucide="lock"></i><input class="input" id="confirm_password" name="confirm_password" type="password" placeholder="Parolni qayta kiriting" autocomplete="new-password" required></div></div>
<button class="btn btn-primary btn-lg btn-block" type="submit"><i data-lucide="user-plus"></i><span>Ro‘yxatdan o‘tish</span></button>
</form>
<div class="auth-foot">Hisobingiz bormi? <a href="login.html"><b>Kirish</b></a></div>
</div></main>
</div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
